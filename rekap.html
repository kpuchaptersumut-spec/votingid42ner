<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekapitulasi Suara - ID42NER Chapter Sumut</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen text-gray-800">

  <!-- Header -->
  <header class="bg-red-700 text-white shadow-lg py-6 px-4">
    <div class="max-w-5xl mx-auto text-center">
      <h1 class="text-2xl md:text-3xl font-bold tracking-wide">REKAPITULASI PEROLEHAN SUARA</h1>
      <p class="text-sm md:text-base text-red-100 mt-1">Pemilihan Calon Ketua ID42NER Chapter Sumut</p>
    </div>
  </header>

  <!-- Container Utama -->
  <main class="max-w-5xl mx-auto p-4 md:p-6 space-y-6">

    <!-- Card Total Suara Masuk & Indikator -->
    <div class="bg-white rounded-xl shadow-md p-6 flex flex-col md:flex-row justify-between items-center border-l-4 border-red-600">
      <div>
        <h2 class="text-gray-500 text-sm font-semibold uppercase">Total Akumulasi Suara</h2>
        <span id="totalSuara" class="text-4xl font-extrabold text-gray-900">0</span>
        <span class="text-gray-500 font-medium">Suara Sah</span>
      </div>
      <div class="mt-4 md:mt-0 flex items-center space-x-2 bg-green-50 px-3 py-1.5 rounded-full border border-green-200">
        <span class="w-3 h-3 bg-green-500 rounded-full animate-ping"></span>
        <span class="text-xs font-bold text-green-700 uppercase">Live Sync Google Sheets</span>
      </div>
    </div>

    <!-- Tabel Rekapitulasi -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
        <h3 class="font-bold text-gray-700">Rincian Tabulasi Suara</h3>
        <button onclick="fetchRekap()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded font-semibold transition">
          Refresh Data
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-gray-600 text-xs uppercase tracking-wider border-b">
              <th class="py-3 px-4 text-center">No</th>
              <th class="py-3 px-4">Nama Kandidat</th>
              <th class="py-3 px-4 text-center">Suara Murni</th>
              <th class="py-3 px-4 text-center">Tambahan</th>
              <th class="py-3 px-4 text-center">Total Akhir</th>
              <th class="py-3 px-4 text-center">Persentase</th>
            </tr>
          </thead>
          <tbody id="tabelRekapBody" class="divide-y divide-gray-200 text-sm">
            <tr>
              <td colspan="6" class="text-center py-6 text-gray-400 italic">Memuat data rekapitulasi...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycb.../exec";

    async function fetchRekap() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getRekap`);
        const result = await response.json();

        if (result.status === "success") {
          document.getElementById("totalSuara").innerText = result.totalKeseluruhan;
          renderTabel(result.data, result.totalKeseluruhan);
        } else {
          alert("Gagal memuat data: " + result.message);
        }
      } catch (error) {
        console.error("Error fetching rekap:", error);
      }
    }

    function renderTabel(data, totalKeseluruhan) {
      const tbody = document.getElementById("tabelRekapBody");
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-gray-400">Belum ada data rekapitulasi.</td></tr>`;
        return;
      }

      data.forEach(item => {
        const persentase = totalKeseluruhan > 0 
          ? ((item.totalAkhir / totalKeseluruhan) * 100).toFixed(1) 
          : 0;

        tbody.innerHTML += `
          <tr class="hover:bg-gray-50 transition">
            <td class="py-4 px-4 text-center font-bold text-gray-500">${item.no}</td>
            <td class="py-4 px-4 font-bold text-gray-800">${item.kandidat}</td>
            <td class="py-4 px-4 text-center text-gray-600 font-semibold">${item.suaraMurni}</td>
            <td class="py-4 px-4 text-center text-blue-600 font-semibold">+${item.tambahan}</td>
            <td class="py-4 px-4 text-center text-red-600 font-extrabold text-base">${item.totalAkhir}</td>
            <td class="py-4 px-4 text-center">
              <span class="inline-block bg-red-100 text-red-800 font-bold px-2.5 py-1 rounded-full text-xs">
                ${persentase}%
              </span>
            </td>
          </tr>
        `;
      });
    }

    // Jalankan otomatis saat halaman dibuka
    fetchRekap();

    // Auto update data setiap 15 detik
    setInterval(fetchRekap, 15000);
  </script>
</body>
</html>
