<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Count - E-Voting ID42NER Sumut</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen text-gray-800">

  <!-- Header -->
  <header class="bg-red-700 text-white shadow-lg py-6 px-4">
    <div class="max-w-4xl mx-auto text-center">
      <h1 class="text-2xl md:text-3xl font-bold tracking-wide">QUICK COUNT REAL-TIME</h1>
      <p class="text-sm md:text-base text-red-100 mt-1">Pemilihan Calon Ketua ID42NER Chapter Sumut</p>
    </div>
  </header>

  <!-- Container Utama -->
  <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">

    <!-- Card Total Suara & Indikator Live -->
    <div class="bg-white rounded-xl shadow-md p-6 flex flex-col md:flex-row justify-between items-center border-l-4 border-red-600">
      <div>
        <h2 class="text-gray-500 text-sm font-semibold uppercase">Total Suara Masuk</h2>
        <span id="totalSuara" class="text-4xl font-extrabold text-gray-900">0</span>
        <span class="text-gray-500 font-medium">Suara</span>
      </div>
      <div class="mt-4 md:mt-0 flex items-center space-x-2 bg-green-50 px-3 py-1.5 rounded-full border border-green-200">
        <span class="w-3 h-3 bg-green-500 rounded-full animate-ping"></span>
        <span class="text-xs font-bold text-green-700 uppercase">Live Update (10 Detik)</span>
      </div>
    </div>

    <!-- Layout Grafik & List Rekapitulasi -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Box Grafik Pie/Donut -->
      <div class="bg-white rounded-xl shadow-md p-6 flex flex-col items-center justify-center">
        <h3 class="text-lg font-bold mb-4 text-gray-700">Persentase Perolehan</h3>
        <div class="w-full max-w-[280px]">
          <canvas id="votingChart"></canvas>
        </div>
      </div>

      <!-- Box Detail Per kandidat -->
      <div class="bg-white rounded-xl shadow-md p-6">
        <h3 class="text-lg font-bold mb-4 text-gray-700 border-b pb-2">Rincian Perolehan Suara</h3>
        <div id="kandidatList" class="space-y-4">
          <p class="text-gray-400 text-sm italic">Memuat data perolehan...</p>
        </div>
      </div>

    </div>

  </main>

  <script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycb.../exec";

    let chartInstance = null;

    async function fetchHasilVoting() {
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getHasil`);
        const data = await response.json();

        if (data.status === "success") {
          document.getElementById("totalSuara").innerText = data.totalSuara;
          updateDashboard(data.hasil, data.totalSuara);
        }
      } catch (error) {
        console.error("Gagal mengambil data hasil:", error);
      }
    }

    function updateDashboard(hasil, totalSuara) {
      const labels = Object.keys(hasil);
      const counts = Object.values(hasil);

      // 1. Update List Kandidat
      const listContainer = document.getElementById("kandidatList");
      listContainer.innerHTML = "";

      const colors = ['#dc2626', '#2563eb', '#16a34a', '#d97706', '#9333ea'];

      labels.forEach((nama, index) => {
        const jumlah = counts[index];
        const persentase = totalSuara > 0 ? ((jumlah / totalSuara) * 100).toFixed(1) : 0;
        const color = colors[index % colors.length];

        listContainer.innerHTML += `
          <div>
            <div class="flex justify-between items-center mb-1">
              <span class="font-bold text-gray-700">${nama}</span>
              <span class="text-sm font-semibold text-gray-900">${jumlah} Suara (${persentase}%)</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
              <div class="h-3 rounded-full transition-all duration-500" style="width: ${persentase}%; background-color: ${color};"></div>
            </div>
          </div>
        `;
      });

      // 2. Update atau Buat Chart.js Diagram
      const ctx = document.getElementById('votingChart').getContext('2d');
      
      if (chartInstance) {
        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = counts;
        chartInstance.update();
      } else {
        chartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: counts,
              backgroundColor: colors.slice(0, labels.length)
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'bottom' }
            }
          }
        });
      }
    }

    // Jalankan pertama kali saat halaman dibuka
    fetchHasilVoting();

    // Auto Refresh setiap 10 detik
    setInterval(fetchHasilVoting, 10000);
  </script>
</body>
</html>
